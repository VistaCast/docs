<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img">
  <title>三种光照：低角环形光、同轴或穹顶、彩色分层</title>
  <rect width="960" height="280" fill="#f4f7fb"/>
  <defs>
    <marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fa8c16"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1677FF"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5222d"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52c41a"/>
    </marker>
  </defs>
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif">
    <rect x="16" y="16" width="300" height="248" rx="12" fill="#ffffff" stroke="#e6eaf0"/>
    <text x="32" y="44" font-size="16" fill="#1677FF">低角环形光</text>
    <polygon points="96,150 166,108 236,150" fill="#e8c872" stroke="#b8860b"/>
    <rect x="70" y="150" width="192" height="14" rx="2" fill="#c5ced8"/>
    <line x1="48" y1="168" x2="110" y2="142" stroke="#fa8c16" stroke-width="2" marker-end="url(#a-orange)"/>
    <line x1="284" y1="168" x2="220" y2="142" stroke="#fa8c16" stroke-width="2" marker-end="url(#a-orange)"/>
    <text x="32" y="200" font-size="14" fill="#1d2129">光从侧面擦过焊点</text>
    <text x="32" y="224" font-size="14" fill="#1d2129">外形和连锡更容易看见</text>
    <text x="32" y="248" font-size="13" fill="#5c6b7a">焊点工位的起步光源</text>
    <rect x="332" y="16" width="300" height="248" rx="12" fill="#ffffff" stroke="#e6eaf0"/>
    <text x="348" y="44" font-size="16" fill="#1677FF">同轴 / 穹顶</text>
    <path d="M 400 78 Q 482 48 564 78" fill="none" stroke="#91caff" stroke-width="3"/>
    <line x1="482" y1="70" x2="482" y2="118" stroke="#1677FF" stroke-width="2" marker-end="url(#a-blue)"/>
    <polygon points="412,150 482,108 552,150" fill="#e8c872" stroke="#b8860b"/>
    <rect x="386" y="150" width="192" height="14" rx="2" fill="#c5ced8"/>
    <text x="348" y="200" font-size="14" fill="#1d2129">光从正面压住反光</text>
    <text x="348" y="224" font-size="14" fill="#1d2129">焊盘镜面发亮时使用</text>
    <text x="348" y="248" font-size="13" fill="#5c6b7a">可与低角光配合</text>
    <rect x="648" y="16" width="296" height="248" rx="12" fill="#ffffff" stroke="#e6eaf0"/>
    <text x="664" y="44" font-size="16" fill="#1677FF">彩色分层</text>
    <polygon points="728,150 798,108 868,150" fill="#e8c872" stroke="#b8860b"/>
    <rect x="702" y="150" width="192" height="14" rx="2" fill="#c5ced8"/>
    <line x1="680" y1="176" x2="748" y2="140" stroke="#f5222d" stroke-width="2" marker-end="url(#a-red)"/>
    <line x1="798" y1="72" x2="798" y2="112" stroke="#52c41a" stroke-width="2" marker-end="url(#a-green)"/>
    <line x1="916" y1="176" x2="848" y2="140" stroke="#1677FF" stroke-width="2" marker-end="url(#a-blue)"/>
    <text x="664" y="200" font-size="14" fill="#1d2129">不同角度用不同颜色</text>
    <text x="664" y="224" font-size="14" fill="#1d2129">一次曝光看焊角倾斜</text>
    <text x="664" y="248" font-size="13" fill="#5c6b7a">颜色只代表照射方向</text>
  </g>
</svg>
