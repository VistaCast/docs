<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img">
  <title>SMT 取像：S1 离线治具俯拍，S2 在线停走俯拍</title>
  <rect width="920" height="340" fill="#f4f7fb"/>
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif">
    <rect x="16" y="16" width="436" height="308" rx="12" fill="#ffffff" stroke="#e6eaf0"/>
    <text x="36" y="46" font-size="18" fill="#1677FF">S1 离线工位</text>
    <rect x="190" y="68" width="72" height="26" rx="4" fill="#1677FF"/>
    <rect x="214" y="94" width="24" height="8" rx="2" fill="#1d2129"/>
    <polygon points="226,104 150,176 302,176" fill="#1677FF" fill-opacity="0.12" stroke="#1677FF" stroke-dasharray="5 4"/>
    <rect x="168" y="164" width="28" height="14" rx="2" fill="#595959"/>
    <rect x="206" y="160" width="22" height="18" rx="2" fill="#595959"/>
    <rect x="240" y="166" width="36" height="12" rx="2" fill="#595959"/>
    <rect x="156" y="178" width="148" height="20" rx="2" fill="#1f7a4d"/>
    <rect x="132" y="200" width="196" height="16" rx="3" fill="#d0d5dd"/>
    <text x="36" y="252" font-size="15" fill="#1d2129">固定治具保证位置</text>
    <text x="36" y="276" font-size="15" fill="#1d2129">相机俯拍，板子静止</text>
    <text x="36" y="300" font-size="15" fill="#1d2129">扫码枪或脚踏触发</text>
    <rect x="468" y="16" width="436" height="308" rx="12" fill="#ffffff" stroke="#e6eaf0"/>
    <text x="488" y="46" font-size="18" fill="#1677FF">S2 在线停走</text>
    <rect x="654" y="68" width="72" height="26" rx="4" fill="#1677FF"/>
    <rect x="678" y="94" width="24" height="8" rx="2" fill="#1d2129"/>
    <polygon points="690,104 614,176 766,176" fill="#1677FF" fill-opacity="0.12" stroke="#1677FF" stroke-dasharray="5 4"/>
    <line x1="500" y1="198" x2="860" y2="198" stroke="#8b95a5" stroke-width="6" stroke-linecap="round"/>
    <rect x="620" y="168" width="120" height="22" rx="2" fill="#1f7a4d"/>
    <rect x="742" y="160" width="10" height="40" rx="2" fill="#fa8c16"/>
    <circle cx="560" cy="150" r="8" fill="#fa8c16"/>
    <line x1="568" y1="154" x2="620" y2="176" stroke="#fa8c16" stroke-dasharray="4 3"/>
    <text x="488" y="252" font-size="15" fill="#1d2129">限位到位后停住再拍</text>
    <text x="488" y="276" font-size="15" fill="#1d2129">光电触发。大板分区多相机</text>
    <text x="488" y="300" font-size="15" fill="#1d2129">固定机位，停稳再拍</text>
  </g>
</svg>
